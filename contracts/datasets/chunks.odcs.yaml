version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:contract:chunks:1.0.0
name: chunks
status: active
domain: arxiv-int
description:
  purpose: Chunker-partitioned text units derived from documents for retrieval and extraction.
team:
  name: arxiv-int
  members:
    - username: contracts@arxiv-int.local
      role: Owner
servers:
  - server: normalized-lake
    type: local
    description: Partitioned normalized lake under RESULTS_DIR
    path: normalized/chunks
    format: parquet
customProperties:
  - property: x-arxiv-int
    value:
      schema: corpus
      table: chunks
      partitionKey: bucket
      search:
        textFields:
          - text
        tokenizer: russian_stem
schema:
  - name: chunks
    physicalName: chunks
    logicalType: object
    properties:
      - name: chunk_id
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.chunkId
                semanticTerm: "urn:arxiv-int:term:chunk-id"
      - name: document_id
        logicalType: string
        relationships:
          - type: foreignKey
            to: documents.document_id
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.documentId
                semanticTerm: "urn:arxiv-int:term:document-id"
      - name: chunker_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.chunkerId
                semanticTerm: "urn:arxiv-int:term:chunker-id"
      - name: ordinal
        logicalType: integer
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.ordinal
                semanticTerm: "urn:arxiv-int:term:ordinal"
      - name: text
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.text
                semanticTerm: "urn:arxiv-int:term:text"
      - name: start_char
        logicalType: integer
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.startChar
                semanticTerm: "urn:arxiv-int:term:start-char"
      - name: end_char
        logicalType: integer
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.endChar
                semanticTerm: "urn:arxiv-int:term:end-char"
      - name: generation_id
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.generationId
                semanticTerm: "urn:arxiv-int:term:generation-id"
      - name: contract_version
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: chunk.contractVersion
                semanticTerm: "urn:arxiv-int:term:contract-version"
