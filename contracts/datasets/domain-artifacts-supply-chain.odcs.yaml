version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:contract:domain-artifacts-supply-chain:1.0.0
name: domain-artifacts-supply-chain
status: active
domain: arxiv-int
description:
  purpose: Supply-chain stage edges separating quote, order, invoice, ship, receive,
    and pay claims.
team:
  name: arxiv-int
  members:
  - username: contracts@arxiv-int.local
    role: Owner
servers:
- server: normalized-lake
  type: local
  description: Partitioned normalized lake under RESULTS_DIR
  path: normalized/domain-artifacts-supply-chain
  format: parquet
customProperties:
- property: x-arxiv-int
  value:
    schema: kg
    table: supply_chain_edges
    partitionKey: bucket
    graph:
      edgeLabel: SUPPLY
      fromField: from_object_id
      toField: to_object_id
      idField: edge_id
schema:
- name: supply_chain_edges
  physicalName: supply_chain_edges
  logicalType: object
  properties:
  - name: edge_id
    logicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.edgeId
          semanticTerm: urn:arxiv-int:term:edge-id
  - name: path_id
    logicalType: string
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.pathId
          semanticTerm: urn:arxiv-int:term:path-id
  - name: stage
    logicalType: string
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.stage
          semanticTerm: urn:arxiv-int:term:supply-stage
  - name: from_object_id
    logicalType: string
    relationships:
    - type: foreignKey
      to: objects.object_id
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.fromObjectId
          semanticTerm: urn:arxiv-int:term:from-object-id
  - name: to_object_id
    logicalType: string
    relationships:
    - type: foreignKey
      to: objects.object_id
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.toObjectId
          semanticTerm: urn:arxiv-int:term:to-object-id
  - name: role_predicate_id
    logicalType: string
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.rolePredicateId
          semanticTerm: urn:arxiv-int:term:role-predicate-id
  - name: product_object_id
    logicalType: string
    relationships:
    - type: foreignKey
      to: objects.object_id
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.productObjectId
          semanticTerm: urn:arxiv-int:term:product-object-id
  - name: transaction_id
    logicalType: string
    relationships:
    - type: foreignKey
      to: transactions.transaction_id
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.transactionId
          semanticTerm: urn:arxiv-int:term:transaction-id
  - name: direction
    logicalType: string
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.direction
          semanticTerm: urn:arxiv-int:term:direction
  - name: event_time
    logicalType: timestamp
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.eventTime
          semanticTerm: urn:arxiv-int:term:event-time
  - name: status
    logicalType: string
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.status
          semanticTerm: urn:arxiv-int:term:status
  - name: evidence_fact_ids
    logicalType: string
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.evidenceFactIds
          semanticTerm: urn:arxiv-int:term:evidence-fact-ids
  - name: document_id
    logicalType: string
    relationships:
    - type: foreignKey
      to: documents.document_id
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.documentId
          semanticTerm: urn:arxiv-int:term:document-id
  - name: review_state
    logicalType: string
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.reviewState
          semanticTerm: urn:arxiv-int:term:review-state
  - name: confidence
    logicalType: number
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.confidence
          semanticTerm: urn:arxiv-int:term:confidence
  - name: generation_id
    logicalType: string
    required: true
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.generationId
          semanticTerm: urn:arxiv-int:term:generation-id
  - name: contract_version
    logicalType: string
    required: true
    customProperties:
    - property: x-arxiv-int
      value:
        canonicalBinding:
          binding: supply_chain_edge.contractVersion
          semanticTerm: urn:arxiv-int:term:contract-version
