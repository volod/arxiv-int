version: 2
models:
  - name: int_documents_current
    description: >
      Fixture incremental snapshot of current documents. Grain is document_id.
      Missing source keys are deleted when reconcile_deletes is true. A policy_version
      change requires a full refresh from the typed runner.
    config:
      meta:
        grain: document_id
        incremental_deletion: reconcile_missing_keys
    columns:
      - name: document_id
        description: Stable document identity.
        tests:
          - not_null
          - unique
      - name: policy_version
        description: Formula/policy fingerprint supplied by the runner.
        tests:
          - not_null
      - name: derived_generation_id
        description: Isolated derived generation that owns this relation.
        tests:
          - not_null
