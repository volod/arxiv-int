[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-python-project"
version = "0.1.0"
description = "A copy-ready Python project with agent governance and executable quality checks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Project Contributors" }]
keywords = ["agentic-development", "project-template", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "complexipy==6.0.0",
  "mypy>=1.15,<2",
  "pymarkdownlnt>=0.9.32,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "radon==6.0.1",
  "ruff>=0.11,<0.17",
  "shellcheck-py==0.11.0.1",
]

[project.scripts]
agent-py = "agent_py.cli:main"
agent-py-plan = "agent_py.quality.plan_summary:main"

[project.urls]
Documentation = "https://example.com/agent-python-project/docs"
Repository = "https://example.com/agent-python-project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/agent_py"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["agent_py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.pymarkdown]
extensions.markdown-tables.enabled = true
plugins.MD013.line_length = 100
plugins.MD013.code_block_line_length = 100
plugins.MD013.heading_line_length = 100
plugins.MD013.tables = false
plugins.MD022.enabled = false
plugins.MD024.enabled = false
plugins.MD032.enabled = false
plugins.MD040.enabled = false
