[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-int"
version = "0.1.0"
description = "A local-first knowledge discovery platform for large document archives"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "arxiv-int Contributors" }]
keywords = ["document-archives", "knowledge-discovery", "local-first", "russian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

# Optional feature groups. src/arxiv_int/features/catalog.py declares their purpose, licences,
# system dependencies, and the pipeline stages that activate them; a reserved group has no extra
# until the owning capability adds one. Output-sensitive tooling is pinned exactly.
[project.optional-dependencies]
contracts = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
]
dev = [
  "complexipy==6.0.0",
  "mypy==1.20.2",
  "pymarkdownlnt==0.9.39",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "radon==6.0.1",
  "ruff==0.16.5",
  "shellcheck-py==0.11.0.1",
  "types-pyyaml>=6.0.12,<7",
]
graph = [
  "pyshacl>=0.30,<1",
  "rdflib>=7.1,<8",
]
inference = [
  "httpx>=0.28,<1",
]
lake = [
  "duckdb>=1.1,<2",
  "pyarrow>=18,<23",
]
store = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
arxiv-int = "arxiv_int.cli:main"
arxiv-int-plan = "arxiv_int.quality.plan_summary:main"

[project.urls]
Documentation = "https://github.com/volod/arxiv-int/tree/main/docs"
Repository = "https://github.com/volod/arxiv-int"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/arxiv_int"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["arxiv_int"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.pymarkdown]
extensions.markdown-tables.enabled = true
plugins.MD013.line_length = 100
plugins.MD013.code_block_line_length = 100
plugins.MD013.heading_line_length = 100
plugins.MD013.tables = false
plugins.MD022.enabled = false
plugins.MD024.enabled = false
plugins.MD032.enabled = false
plugins.MD040.enabled = false
