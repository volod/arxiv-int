version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:canonical:object:1.0.0
name: object
status: active
schema:
  - name: object
    logicalType: object
    properties:
      - name: object_id
        logicalType: string
        required: true
        primaryKey: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: object.objectId
                semanticTerm: "urn:arxiv-int:term:object-id"
      - name: object_type
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: object.objectType
                semanticTerm: "urn:arxiv-int:term:object-type"
      - name: preferred_label
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: object.preferredLabel
                semanticTerm: "urn:arxiv-int:term:preferred-label"
      - name: lifecycle_state
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: object.lifecycleState
                semanticTerm: "urn:arxiv-int:term:lifecycle-state"
      - name: review_state
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: object.reviewState
                semanticTerm: "urn:arxiv-int:term:review-state"
      - name: cluster_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
