version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:canonical:fact:1.0.0
name: fact
status: active
schema:
  - name: fact
    logicalType: object
    properties:
      - name: fact_id
        logicalType: string
        required: true
        primaryKey: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: fact.factId
                semanticTerm: "urn:arxiv-int:term:fact-id"
      - name: subject_object_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: fact.subjectObjectId
                semanticTerm: "urn:arxiv-int:term:subject-object-id"
      - name: predicate_id
