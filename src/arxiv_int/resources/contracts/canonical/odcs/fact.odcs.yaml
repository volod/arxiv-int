        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: fact.predicateId
                semanticTerm: "urn:arxiv-int:term:predicate-id"
      - name: object_object_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: fact.objectObjectId
                semanticTerm: "urn:arxiv-int:term:object-object-id"
      - name: literal_value
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
