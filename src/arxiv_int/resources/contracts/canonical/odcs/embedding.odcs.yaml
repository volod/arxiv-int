                binding: embedding.targetId
                semanticTerm: "urn:arxiv-int:term:target-id"
      - name: profile_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: embedding.profileId
                semanticTerm: "urn:arxiv-int:term:profile-id"
      - name: dimensions
        logicalType: integer
        customProperties:
          - property: x-arxiv-int
            value:
