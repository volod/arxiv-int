sources:
  - description: Canonical corpus relations owned by Alembic.
    name: corpus
    schema: corpus
    tables:
      - columns:
          - description: classification_id must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.classification_id.type
                - file-classifications.classification_id.nullability
                - file-classifications.classification_id.batch_unique
                - file-classifications.classification_id.unique
            name: classification_id
            tests:
              - not_null
              - unique
          - description: occurrence_id must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.occurrence_id.type
                - file-classifications.occurrence_id.nullability
                - file-classifications.occurrence_id.relationship
            name: occurrence_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: occurrence_id
                    to: "source('corpus', 'source_occurrences')"
          - description: document_id must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.document_id.type
                - file-classifications.document_id.relationship
            name: document_id
            tests:
              - relationships:
                  arguments:
                    field: document_id
                    to: "source('corpus', 'documents')"
          - description: silo_id must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.silo_id.type
                - file-classifications.silo_id.nullability
            name: silo_id
            tests:
              - not_null
          - description: relative_path must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.relative_path.type
                - file-classifications.relative_path.nullability
            name: relative_path
            tests:
              - not_null
          - description: primary_class_id must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.primary_class_id.type
                - file-classifications.primary_class_id.nullability
            name: primary_class_id
            tests:
              - not_null
          - description: alternate_class_ids_json must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.alternate_class_ids_json.type
                - file-classifications.alternate_class_ids_json.nullability
            name: alternate_class_ids_json
            tests:
              - not_null
          - description: ancestor_path must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.ancestor_path.type
                - file-classifications.ancestor_path.nullability
            name: ancestor_path
            tests:
              - not_null
          - description: confidence must match logical type number.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.confidence.type
                - file-classifications.confidence.nullability
            name: confidence
            tests:
              - not_null
          - description: calibration_profile must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.calibration_profile.type
                - file-classifications.calibration_profile.nullability
            name: calibration_profile
            tests:
              - not_null
          - description: scores_json must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.scores_json.type
                - file-classifications.scores_json.nullability
            name: scores_json
            tests:
              - not_null
          - description: evidence_json must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.evidence_json.type
                - file-classifications.evidence_json.nullability
            name: evidence_json
            tests:
              - not_null
          - description: failure_reason must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.failure_reason.type
            name: failure_reason
          - description: extraction_fingerprint must match logical type string.
            meta:
