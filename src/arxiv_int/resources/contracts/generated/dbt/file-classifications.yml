                - file-classifications.run_id.type
                - file-classifications.run_id.nullability
            name: run_id
            tests:
              - not_null
          - description: generation_id must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.generation_id.type
                - file-classifications.generation_id.nullability
            name: generation_id
            tests:
              - not_null
          - description: contract_version must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.contract_version.type
                - file-classifications.contract_version.nullability
            name: contract_version
            tests:
              - not_null
          - description: Declared physical partition key from x-arxiv-int.partitionKey. bucket must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.bucket.type
            name: bucket
        config:
          meta:
            arxiv_int_contract_id: file-classifications
        description: Complete, evidence-backed subject classification of physical archive files, including explicit unclassified and unreadable outcomes and the fingerprints needed to reproduce each decision.
        meta:
          odcs_id: "urn:arxiv-int:contract:file-classifications:1.0.0"
          primary_key:
            - classification_id
          rule_catalog_version: 1.0.0
        name: file_classification
version: 2
