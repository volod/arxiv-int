          - description: configuration_sha256 must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.configuration_sha256.type
                - file-classifications.configuration_sha256.nullability
            name: configuration_sha256
            tests:
              - not_null
          - description: scheme_id must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.scheme_id.type
                - file-classifications.scheme_id.nullability
            name: scheme_id
            tests:
              - not_null
          - description: review_state must match logical type string.
            meta:
              arxiv_int_rule_ids:
                - file-classifications.review_state.type
