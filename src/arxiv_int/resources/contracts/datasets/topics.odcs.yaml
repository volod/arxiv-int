version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:contract:topics:1.0.0
name: topics
status: active
domain: arxiv-int
description:
  purpose: Topic assignments linking documents to labeled topics under a scheme.
team:
  name: arxiv-int
  members:
    - username: contracts@arxiv-int.local
      role: Owner
servers:
  - server: normalized-lake
    type: local
    description: Partitioned normalized lake under RESULTS_DIR
    path: normalized/topics
    format: parquet
customProperties:
  - property: x-arxiv-int
    value:
      schema: search
      table: topic_assignments
      partitionKey: bucket
schema:
  - name: topic_assignments
    physicalName: topic_assignments
    logicalType: object
    properties:
      - name: topic_assignment_id
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.topicAssignmentId
                semanticTerm: "urn:arxiv-int:term:topic-assignment-id"
      - name: topic_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.topicId
                semanticTerm: "urn:arxiv-int:term:topic-id"
      - name: label
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.label
                semanticTerm: "urn:arxiv-int:term:label"
      - name: scheme_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.schemeId
                semanticTerm: "urn:arxiv-int:term:scheme-id"
      - name: document_id
        logicalType: string
        relationships:
          - type: foreignKey
            to: documents.document_id
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.documentId
                semanticTerm: "urn:arxiv-int:term:document-id"
      - name: score
        logicalType: number
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.score
                semanticTerm: "urn:arxiv-int:term:score"
      - name: generation_id
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.generationId
                semanticTerm: "urn:arxiv-int:term:generation-id"
      - name: contract_version
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: topic.contractVersion
                semanticTerm: "urn:arxiv-int:term:contract-version"
