version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:contract:classification-classes:1.0.0
name: classification-classes
status: active
domain: arxiv-int
description:
  purpose: >-
    Frozen classes of one versioned subject-taxonomy classification scheme: taxonomy classes,
    operator extensions and the unclassified/unreadable outcomes, with parent closure,
    multilingual captions, source crosswalk, and reversible path tokens.
team:
  name: arxiv-int
  members:
    - username: contracts@arxiv-int.local
      role: Owner
servers:
  - server: normalized-lake
    type: local
    description: Partitioned normalized lake under RESULTS_DIR
    path: normalized/classification-classes
    format: parquet
customProperties:
  - property: x-arxiv-int
    value:
      schema: corpus
      table: classification_classes
schema:
  - name: classification_classes
    physicalName: classification_classes
    logicalType: object
    properties:
      - name: scheme_class_id
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.schemeClassId
                semanticTerm: "urn:arxiv-int:term:scheme-class-id"
      - name: scheme_id
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.schemeId
                semanticTerm: "urn:arxiv-int:term:scheme-id"
      - name: class_id
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.classId
                semanticTerm: "urn:arxiv-int:term:class-id"
      - name: namespace
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.namespace
                semanticTerm: "urn:arxiv-int:term:class-namespace"
      - name: code
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.code
                semanticTerm: "urn:arxiv-int:term:class-code"
      - name: parent_class_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.parentClassId
                semanticTerm: "urn:arxiv-int:term:parent-class-id"
      - name: ancestor_path
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.ancestorPath
                semanticTerm: "urn:arxiv-int:term:ancestor-path"
      - name: depth
        logicalType: integer
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.depth
                semanticTerm: "urn:arxiv-int:term:class-depth"
      - name: class_kind
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.classKind
                semanticTerm: "urn:arxiv-int:term:kind"
      - name: caption_en
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: classification_class.captionEn
                semanticTerm: "urn:arxiv-int:term:caption-en"
      - name: caption_ru
