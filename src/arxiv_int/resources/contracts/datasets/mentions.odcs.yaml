version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:contract:mentions:1.0.0
name: mentions
status: active
domain: arxiv-int
description:
  purpose: Surface-form mentions linking documents, spans, and chunks to object anchors.
team:
  name: arxiv-int
  members:
    - username: contracts@arxiv-int.local
      role: Owner
servers:
  - server: normalized-lake
    type: local
    description: Partitioned normalized lake under RESULTS_DIR
    path: normalized/mentions
    format: parquet
customProperties:
  - property: x-arxiv-int
    value:
      schema: kg
      table: mentions
      partitionKey: bucket
schema:
  - name: mentions
    physicalName: mentions
    logicalType: object
    properties:
      - name: mention_id
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.mentionId
                semanticTerm: "urn:arxiv-int:term:mention-id"
      - name: document_id
        logicalType: string
        relationships:
          - type: foreignKey
            to: documents.document_id
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.documentId
                semanticTerm: "urn:arxiv-int:term:document-id"
      - name: span_id
        logicalType: string
        relationships:
          - type: foreignKey
            to: spans.span_id
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.spanId
                semanticTerm: "urn:arxiv-int:term:span-id"
      - name: chunk_id
        logicalType: string
        relationships:
          - type: foreignKey
            to: chunks.chunk_id
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.chunkId
                semanticTerm: "urn:arxiv-int:term:chunk-id"
      - name: surface_form
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.surfaceForm
                semanticTerm: "urn:arxiv-int:term:surface-form"
      - name: object_anchor_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.objectAnchorId
                semanticTerm: "urn:arxiv-int:term:object-anchor-id"
      - name: generation_id
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.generationId
                semanticTerm: "urn:arxiv-int:term:generation-id"
      - name: contract_version
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: mention.contractVersion
                semanticTerm: "urn:arxiv-int:term:contract-version"
