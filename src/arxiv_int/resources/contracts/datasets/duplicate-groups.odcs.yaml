version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:contract:duplicate-groups:1.0.0
name: duplicate-groups
status: active
domain: arxiv-int
description:
  purpose: Reversible duplicate and edition group memberships proposed over normalized documents.
team:
  name: arxiv-int
  members:
    - username: contracts@arxiv-int.local
      role: Owner
servers:
  - server: normalized-lake
    type: local
    description: Partitioned normalized lake under RESULTS_DIR
    path: normalized/duplicate-groups
    format: parquet
customProperties:
  - property: x-arxiv-int
    value:
      schema: corpus
      table: duplicate_groups
      partitionKey: bucket
schema:
  - name: duplicate_groups
    physicalName: duplicate_groups
    logicalType: object
    properties:
      - name: duplicate_membership_id
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.duplicateMembershipId
                semanticTerm: "urn:arxiv-int:term:duplicate-membership-id"
      - name: group_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.groupId
                semanticTerm: "urn:arxiv-int:term:duplicate-group-id"
      - name: document_id
        logicalType: string
        relationships:
          - type: foreignKey
            to: documents.document_id
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.documentId
                semanticTerm: "urn:arxiv-int:term:document-id"
      - name: method
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.method
                semanticTerm: "urn:arxiv-int:term:duplicate-method"
      - name: role
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.role
                semanticTerm: "urn:arxiv-int:term:duplicate-role"
      - name: score
        logicalType: number
        physicalType: double
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.score
                semanticTerm: "urn:arxiv-int:term:score"
      - name: suppressed
        logicalType: boolean
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.suppressed
                semanticTerm: "urn:arxiv-int:term:suppressed"
      - name: generation_id
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.generationId
                semanticTerm: "urn:arxiv-int:term:generation-id"
      - name: contract_version
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: duplicate_group.contractVersion
                semanticTerm: "urn:arxiv-int:term:contract-version"
