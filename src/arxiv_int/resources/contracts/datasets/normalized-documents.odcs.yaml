version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:arxiv-int:contract:normalized-documents:1.0.0
name: normalized-documents
status: active
domain: arxiv-int
description:
  purpose: Canonical normalized text views, detected language, and reversible offset maps.
team:
  name: arxiv-int
  members:
    - username: contracts@arxiv-int.local
      role: Owner
servers:
  - server: normalized-lake
    type: local
    description: Partitioned normalized lake under RESULTS_DIR
    path: normalized/normalized-documents
    format: parquet
customProperties:
  - property: x-arxiv-int
    value:
      schema: corpus
      table: normalized_documents
      partitionKey: bucket
schema:
  - name: normalized_documents
    physicalName: normalized_documents
    logicalType: object
    properties:
      - name: normalized_document_id
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.normalizedDocumentId
                semanticTerm: "urn:arxiv-int:term:normalized-document-id"
      - name: document_id
        logicalType: string
        relationships:
          - type: foreignKey
            to: documents.document_id
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.documentId
                semanticTerm: "urn:arxiv-int:term:document-id"
      - name: normalizer_id
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.normalizerId
                semanticTerm: "urn:arxiv-int:term:normalizer-id"
      - name: language
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.language
                semanticTerm: "urn:arxiv-int:term:language"
      - name: language_confidence
        logicalType: number
        physicalType: double
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.languageConfidence
                semanticTerm: "urn:arxiv-int:term:confidence"
      - name: normalized_sha256
        logicalType: string
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.normalizedSha256
                semanticTerm: "urn:arxiv-int:term:checksum"
      - name: text_chars
        logicalType: integer
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.textChars
                semanticTerm: "urn:arxiv-int:term:text-chars"
      - name: generation_id
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.generationId
                semanticTerm: "urn:arxiv-int:term:generation-id"
      - name: contract_version
        logicalType: string
        required: true
        customProperties:
          - property: x-arxiv-int
            value:
              canonicalBinding:
                binding: normalized_document.contractVersion
                semanticTerm: "urn:arxiv-int:term:contract-version"
